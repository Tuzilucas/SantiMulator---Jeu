          <span class="guide-tag" aria-hidden="true" data-t="act.touchHere"></span>
        </button>
        <button id="act-coffee" class="act" type="button">
          <svg class="act-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M4 1h1v2H4zM6 1h1v2H6zM2 4h7v1h2v3H9v1H8v1H3V9H2zm7 2v1h1V6zM1 11h10v1H1z" fill-rule="evenodd" /></svg>
          <span class="act-text"><span class="act-label" data-t="act.coffee"></span><small id="act-coffee-sub" class="act-sub"></small></span>
        </button>
        <button id="act-server" class="act" type="button">
          <svg class="act-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h8v10H2zm1 1v2h6V2zm0 3v2h6V5zm0 3v2h6V8z" fill-rule="evenodd" /><path class="led" d="M7 2h1v1H7zM7 5h1v1H7zM7 8h1v1H7z" /></svg>
          <span class="act-text"><span class="act-label" data-t="act.server"></span><small id="act-server-sub" class="act-sub"></small></span>
        </button>
        <aside id="status-card" class="status-card hidden" data-t-label="status.label"></aside>
      </nav>

      <div id="toasts" class="toasts" aria-live="polite"></div>
      <!-- La sonnerie par-dessus une feuille sans bandeau à elle (répondeur, fiche d'un collègue, visite). -->
      <button id="ring-float" class="ring-float hidden" type="button">
        <svg class="act-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M1 2h10v3H8V4H4v1H1zM3 6h6v1h1v4H2V7h1z" /></svg>
        <span id="ring-float-text" class="ring-float-text"></span>
        <b class="ring-float-go" data-t="ringFloat.go"></b>
      </button>

      <section id="phone" class="panel phone hidden" role="dialog" aria-modal="false" aria-labelledby="phone-caller">
        <div class="phone-lcd">
          <span class="lcd-icon" aria-hidden="true">☎</span>
          <span id="phone-caller" class="phone-caller"></span>
          <span id="phone-meta" class="phone-meta"></span>
        </div>
        <div id="phone-mood" class="phone-mood hidden"></div>
        <div id="phone-ticket" class="phone-ticket hidden"></div>
        <div id="phone-log" class="phone-log"></div>
        <div id="phone-choices" class="phone-choices"></div>
      </section>

      <section id="machine" class="panel phone machine hidden" role="dialog" aria-modal="false" aria-labelledby="machine-title">
        <div class="phone-lcd">
          <span class="lcd-icon" aria-hidden="true">✇</span>
          <span id="machine-title" class="phone-caller" data-t="machine.title"></span>
          <span id="machine-meta" class="phone-meta"></span>
        </div>
        <div id="machine-list" class="phone-log machine-list"></div>
        <div class="phone-choices">
          <button id="machine-close" class="choice machine-close" type="button" data-t="machine.close"></button>
        </div>
      </section>

      <section id="studio" class="panel kitchen studio hidden" role="dialog" aria-modal="false" aria-labelledby="st-title">
        <div class="kit-bar st-bar">
          <button id="st-back" class="kit-back hidden" type="button" data-t-label="studio.back">‹</button>
          <span id="st-title" class="kit-title" data-t="studio.title"></span>
          <span id="st-points" class="st-points" data-t-title="studio.points"></span>
          <button id="st-close" class="kit-close" type="button" data-t-label="studio.close">✕</button>
        </div>
        <div id="st-ring" class="kit-ring hidden"><button id="st-ring-text" class="kit-ring-answer" type="button"></button></div>
        <div id="st-tabs" class="st-tabs" role="tablist" data-t-label="studio.title">
          <button class="st-tab" type="button" role="tab" data-tab="home" data-t="studio.tab.home"></button>
          <button class="st-tab" type="button" role="tab" data-tab="jobs"><span data-t="studio.tab.jobs"></span><span class="st-tab-n"></span></button>
          <button class="st-tab" type="button" role="tab" data-tab="research" data-t="studio.tab.research"></button>
          <button class="st-tab hidden" type="button" role="tab" data-tab="shop" data-t="studio.tab.shop"></button>
          <button class="st-tab" type="button" role="tab" data-tab="notebook" data-t="studio.tab.notebook"></button>
        </div>
        <div id="st-body" class="kit-body st-body"></div>
        <div id="st-foot" class="kit-foot st-foot hidden"></div>
      </section>

      <section id="visit" class="panel phone visit hidden" role="dialog" aria-modal="false" aria-labelledby="visit-name">
        <div class="visit-head">
          <div id="visit-face" class="visit-face"></div>
          <div class="visit-id">
            <span id="visit-name" class="visit-name"></span>
            <span id="visit-role" class="visit-role"></span>
            <span id="visit-patience" class="visit-patience" role="meter" data-t-label="visit.patience" aria-valuemin="0" aria-valuemax="100"><span id="visit-patience-fill"></span></span>
          </div>
          <button id="visit-close" class="win-close visit-close" type="button" data-t-label="visit.close">✕</button>
        </div>
        <div id="visit-log" class="phone-log"></div>
        <div id="visit-choices" class="phone-choices"></div>
      </section>

      <section id="colleague-card" class="panel phone colleague-card hidden" role="dialog" aria-modal="false" aria-labelledby="cc-name">
        <button id="cc-close" class="win-close visit-close cc-close" type="button" data-t-label="card.close">✕</button>
        <div id="cc-body" class="cc-body"></div>
        <div class="phone-choices">
          <button id="cc-robot" class="choice cc-robot hidden" type="button"></button>
          <button id="cc-go" class="choice primary cc-go" type="button" data-t="card.go"></button>
        </div>
      </section>

      <section id="robots" class="panel phone robots-panel hidden" role="dialog" aria-modal="false" aria-labelledby="rb-title">
        <div class="rb-bar">
          <span id="rb-title" class="rb-title"></span>
          <span id="rb-points" class="st-points rb-points"></span>
          <button id="rb-close" class="win-close visit-close rb-close" type="button">✕</button>
        </div>
        <div id="rb-body" class="cc-body rb-body"></div>
        <div id="rb-foot" class="phone-choices rb-foot"></div>
      </section>

      <section id="service" class="panel phone service-panel hidden" role="dialog" aria-modal="false" aria-labelledby="sv-title">
        <div class="rb-bar sv-bar">
          <span id="sv-title" class="rb-title sv-title"></span>
          <span id="sv-grade" class="sv-grade"></span>
          <button id="sv-close" class="win-close visit-close rb-close" type="button">✕</button>
        </div>
        <div id="sv-head" class="sv-head"></div>
        <div id="sv-tabs" class="sv-tabs" role="tablist"></div>
        <div id="sv-body" class="cc-body sv-body"></div>
        <div id="sv-foot" class="phone-choices sv-foot"></div>
      </section>

      <section id="mail" class="panel mail hidden" role="dialog" aria-modal="false" aria-labelledby="mail-title">
        <div class="win-bar">
          <button id="mail-back" class="win-back hidden" type="button" data-t="mail.back" data-t-label="mail.back.label"></button>
          <span id="mail-title" class="win-title" data-t="mail.title"></span>
          <button id="mail-close" class="win-close" type="button" data-t-label="mail.close">✕</button>
        </div>
        <div id="mail-ring" class="win-ring hidden">
          <button id="mail-ring-text" class="win-ring-answer" type="button"></button>
          <button id="mail-ring-ticket" class="win-ring-ticket hidden" type="button" data-t="mail.ticket"></button>
        </div>
        <div id="mail-tools" class="mail-tools hidden">
          <div id="mail-tabs" class="mail-tabs hidden" role="tablist" data-t-label="mail.tabs">
            <button id="mail-tab-inbox" class="mail-tab active" type="button" role="tab" aria-selected="true" data-t="mail.tab.inbox"></button>
            <button id="mail-tab-desk" class="mail-tab" type="button" role="tab" aria-selected="false" data-t="mail.tab.desk"></button>
          </div>
          <div class="mail-auto">
            <span id="mail-ai" class="mail-ai hidden"></span>
            <button id="mail-script" class="mail-script hidden" type="button"></button>
          </div>
        </div>
        <div id="mail-strip" class="mail-strip hidden" aria-live="polite"></div>
        <div id="mail-desk" class="mail-desk hidden"></div>
        <div id="mail-body" class="mail-body">
          <ul id="mail-list" class="mail-list" data-t-label="mail.tab.inbox"></ul>
          <article id="mail-read" class="mail-read"></article>
        </div>
      </section>
    </div>
  </body>
</html>
